name: Release portable app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check-version:
    name: Verify tag matches package.json version
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compare tag to package.json
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version." >&2
            exit 1
          fi

  windows-build:
    name: Build Windows portable executable
    needs: check-version
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build portable executable
        run: pnpm dist:win

      - name: Compute checksum
        shell: pwsh
        run: |
          $asset = Get-ChildItem release -Filter "*-portable.exe" | Select-Object -First 1
          if (-not $asset) {
            throw "Portable executable was not generated."
          }
          $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$($asset.FullName).sha256" -Value "$hash  $($asset.Name)" -NoNewline

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            release/*-portable.exe
            release/*-portable.exe.sha256
          if-no-files-found: error

  linux-build:
    name: Build Linux AppImage
    needs: check-version
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build AppImage
        run: pnpm dist:linux

      - name: Compute checksum
        run: |
          set -euo pipefail
          asset=$(find release -maxdepth 1 -name "*.AppImage" | head -n 1)
          if [ -z "$asset" ]; then
            echo "AppImage was not generated." >&2
            exit 1
          fi
          (cd "$(dirname "$asset")" && sha256sum "$(basename "$asset")") > "$asset.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            release/*.AppImage
            release/*.AppImage.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows-build, linux-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(release/*)
          if [ "${#assets[@]}" -ne 4 ]; then
            echo "Expected 4 release assets (exe, AppImage, and a .sha256 for each), found ${#assets[@]}:" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists. This workflow does not overwrite an existing release -- delete it first if you intend to replace it, so a partial or mismatched set of old assets can never linger alongside the new ones." >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PortPatch $GITHUB_REF_NAME" \
            --generate-notes
